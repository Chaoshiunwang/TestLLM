<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#123f37">
<title>學測英文單字＋字根地圖</title>
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<header class="site-header">
  <a class="brand" href="#top"><span class="brand-mark">Aa</span><span><strong>學測英文</strong><small>單字＋字根地圖</small></span></a>
  <nav><a href="#study">今日 20 字</a><a href="#explorer">查單字／字根</a></nav>
</header>
<main id="top">
<section class="hero shell">
  <p class="eyebrow">WORD × ROOT × FREQUENCY</p>
  <h1>查一個字，<br>不只看到中文。</h1>
  <p class="lead">把歷屆學測詞頻、字根拆解與 8 類字根放進同一張學習地圖。</p>
  <form class="hero-search" data-hero-search>
    <label for="hero-query">查單字、字根、中文意義或分類</label>
    <div class="search-row"><input id="hero-query" type="search" placeholder="例如：predict、dict、說、感官動作"><button>查查看</button></div>
  </form>
  <div class="hero-stats"><div><strong data-stat-total>—</strong><span>詞彙紀錄</span></div><div><strong data-stat-rooted>—</strong><span>有字根分類</span></div><div><strong>8</strong><span>字根類別</span></div></div>
</section>
<section id="study" class="study"><div class="shell">
  <div class="study-head"><div><p class="eyebrow coral">TODAY'S 20</p><h2>今天先處理 20 個。</h2><p>會的按「我會了」，不穩的留在「再複習」。也可以直接切換 8 類字根。</p></div><div class="progress"><strong data-progress-count>0</strong><span>已標記</span></div></div>
  <div class="track-switcher"><button data-track="foundation">補地基</button><button data-track="target12" class="is-active">高報酬</button><button data-track="target15">長尾挑戰</button></div>
  <div class="root-picker-wrap"><span class="picker-label">字根分類</span><div class="root-picker" data-root-picker></div></div>
  <p class="study-status" data-study-status>正在整理今天的字……</p>
  <div class="card-grid study-grid" data-study-deck></div>
  <div class="study-tools"><button class="outline" data-refresh-deck>換一組 20 字</button><button class="ghost" data-export-progress>匯出進度</button><button class="text-danger" data-reset-progress>清除本機進度</button></div>
</div></section>
<section id="explorer" class="explorer shell">
  <div class="section-title"><div><p class="eyebrow">WORD & ROOT EXPLORER</p><h2>單字與字根一起查。</h2></div><p>可搜尋 headword、中文提示、字根、字根中文義、構詞拆解與 8 類字根分類。</p></div>
  <div class="filters">
    <label class="wide"><span>搜尋</span><input data-query type="search" placeholder="abandon / dict / 說 / 移動"></label>
    <label><span>級別</span><select data-level><option value="all">全部</option><option value="1">第 1 級</option><option value="2">第 2 級</option><option value="3">第 3 級</option><option value="4">第 4 級</option><option value="5">第 5 級</option><option value="6">第 6 級</option><option value="other">詞表外／附錄</option></select></label>
    <label><span>字根分類</span><select data-root-category><option value="all">全部分類</option></select></label>
    <label><span>優先度</span><select data-tier><option value="all">全部</option><option value="core">核心高頻</option><option value="priority">值得優先</option><option value="long_tail">長尾</option><option value="not_seen">未出現</option></select></label>
    <label><span>排序</span><select data-sort><option value="priority">建議優先</option><option value="frequency">出現次數</option><option value="level">級別</option><option value="alphabetical">A → Z</option></select></label>
  </div>
  <div class="result-meta"><span data-result-count>載入中……</span><a href="./data/gsat-vocabulary-frequency-root.csv" download>下載完整 CSV ↘</a></div>
  <div class="card-grid" data-word-grid></div>
  <button class="outline load-more" data-load-more hidden>再顯示 24 個</button>
</section>
</main>
<dialog data-word-dialog class="word-dialog"><button class="dialog-close" data-dialog-close aria-label="關閉單字詳細資料">×</button><div data-dialog-content></div></dialog>
<div class="toast" data-toast role="status" aria-live="polite"></div>
<script type="module" src="./app.js"></script>
</body></html>
